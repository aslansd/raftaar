[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raftaar"
version = "0.3.1"
description = "Know what your robot demonstrations will teach, before you train. Predicts which policy class will fail on a dataset, and where."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Aslan Satary Dizaji"}]
keywords = [
  "robotics",
  "behaviour-cloning",
  "imitation-learning",
  "dataset-quality",
  "demonstrations",
  "lerobot",
  "data-curation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: what a scan actually needs. Deliberately no matplotlib, no torch, no
# Flask -- a dataset audit should not pull a plotting stack or a web server.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Figures. `raftaar scan` writes the markdown report without this and tells
# you what it skipped.
plot = ["matplotlib>=3.8"]
# Reading LeRobotDataset directories. pyarrow only -- NOT the lerobot package,
# which pulls torch, torchvision and opencv. The adapter reads the on-disk
# format, so a CPU audit stays a CPU audit.
lerobot = ["pyarrow>=14"]
# The rollout study that checks whether the warnings were right.
validate = ["matplotlib>=3.8"]
# The hosted demo in web/.
web = ["flask>=3.0", "gunicorn>=22.0"]
# Record what produced each scan and each validation run.
provenance = ["daftar>=0.8"]
dev = [
  "pytest>=8",
  "matplotlib>=3.8",
  "pyarrow>=14",
]
all = ["matplotlib>=3.8", "pyarrow>=14", "flask>=3.0", "gunicorn>=22.0", "daftar>=0.8"]

[project.urls]
Homepage = "https://github.com/aslansd/raftaar"
Repository = "https://github.com/aslansd/raftaar"
Issues = "https://github.com/aslansd/raftaar/issues"

[project.scripts]
raftaar = "raftaar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
